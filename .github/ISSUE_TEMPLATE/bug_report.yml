name: Bug 报告
description: 报告可以稳定复现的软件问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: 请勿上传 API Key、私人素材、完整配置或未脱敏日志。
  - type: input
    id: version
    attributes:
      label: SmartCut 版本
      placeholder: 例如 1.1.4
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: Windows、Premiere、Python/EXE、本地模型或 API
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 包含入口、保留百分比、音轨、素材时长和精确时间点
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除 API Key、私人素材、个人路径和其他敏感信息。
          required: true

